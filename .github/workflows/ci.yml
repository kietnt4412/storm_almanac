name: ci

# `dev` is here because a push to it with no open PR used to run nothing at all,
# silently: the triggers were `pull_request` and push to `main`, and work lands
# on `dev` first. Nine merges re-armed that trap and every one was caught by a
# person remembering to look, which is not a control. PR #25 once merged before
# its own run had finished and was green by luck.
on:
  push:
    branches: [main, dev]
  pull_request:

# Deliberately keyed by ref, which means a push to `dev` while a PR is open from
# `dev` runs this workflow twice — once on the branch tip and once on the PR's
# merge commit. That duplication is the price of the trigger above and it is
# worth paying. Collapsing the two into one group (`github.head_ref ||
# github.ref_name`) would put the push and the PR in the same group, where
# `cancel-in-progress` cancels the older of them — and a cancelled run is not a
# passing one, so a push would routinely cancel the very check the PR needs
# green in order to merge. Two honest runs beat one that sometimes vanishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      # gradle-wrapper.jar is a committed binary that every build executes.
      # Verify it against the checksums of published Gradle releases before
      # running it, so a tampered wrapper fails the build rather than the build
      # machine.
      # Held at v5 on purpose. v6 moved setup-gradle's caching into a
      # proprietary component, and using it accepts Gradle's Terms of Use — a
      # licence decision for the maintainer, not a version bump. v5 already
      # runs on Node 24, which is all N5 needed.
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon build
      # The module boundaries and the game-agnosticism rule are enforced by
      # tests in :app, so a violation fails this job rather than a review.
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/**/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Component tests in jsdom. What they are for, and the one class of defect
      # they will never catch, is argued in vite.config.ts beside the config —
      # briefly: behaviour is the pipeline's and appearance is a person's,
      # because jsdom computes no layout. Until this line the pipeline rendered
      # nothing, and four defects found by driving a browser were four defects
      # CI could not have found.
      - run: npm test
      - run: npm run build

  # Phase 0's exit criterion: a green pipeline deploying a health endpoint to a
  # real URL. Since B5 it does, and in that order — Render's own auto-deploy is
  # off, so nothing reaches production that this workflow has not first built
  # and tested. A red build never ships.
  #
  # Gated to a push to `main`. This workflow also runs on `dev` and on every
  # pull request, and an ungated job would ship each of them: that hazard is
  # why B6 was paid off before B5, and the gate is a condition of this job
  # existing at all, not a refinement.
  #
  # The job does not trust Render's word that a deploy happened. It waits for
  # /api/health to report this commit — the application reads Render's
  # RENDER_GIT_COMMIT into its version — then smokes the page's own origin,
  # because a reader never talks to Render directly: every request goes through
  # Vercel's rewrite, and a deploy that works on onrender.com and not through
  # the rewrite is a deploy nobody can use.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      API_URL: https://storm-almanac.onrender.com
      PAGE_URL: https://storm-almanac.vercel.app
    steps:
      # The hook is a secret URL: anyone holding it can deploy. It is never
      # echoed, and a missing secret fails loudly rather than skipping — a
      # skipped deploy step would leave this job green with nothing shipped.
      - name: Ask Render to deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set; nothing was deployed"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$RENDER_DEPLOY_HOOK"
      # A free-tier build runs the whole Gradle build in Docker, several
      # minutes; the budget is generous so a slow build is not a red one.
      - name: Wait until the API serves this commit
        timeout-minutes: 25
        run: |
          until curl --silent "$API_URL/api/health" | grep -q "\"version\":\"$GITHUB_SHA\""; do
            sleep 20
          done
          curl --fail --silent --show-error "$API_URL/api/health"
      - name: Smoke through the page's origin
        run: |
          curl --fail --silent --show-error --output /dev/null "$PAGE_URL/"
          curl --fail --silent --show-error "$PAGE_URL/api/health"
          curl --fail --silent --show-error "$PAGE_URL/api/games" | grep -q '"games":\[{'
