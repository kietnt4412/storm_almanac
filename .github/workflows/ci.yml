name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      # gradle-wrapper.jar is a committed binary that every build executes.
      # Verify it against the checksums of published Gradle releases before
      # running it, so a tampered wrapper fails the build rather than the build
      # machine.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon build
      # The module boundaries and the game-agnosticism rule are enforced by
      # tests in :app, so a violation fails this job rather than a review.
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Component tests in jsdom. What they are for, and the one class of defect
      # they will never catch, is argued in vite.config.ts beside the config —
      # briefly: behaviour is the pipeline's and appearance is a person's,
      # because jsdom computes no layout. Until this line the pipeline rendered
      # nothing, and four defects found by driving a browser were four defects
      # CI could not have found.
      - run: npm test
      - run: npm run build

  # Phase 0's exit criterion: a green pipeline deploying a health endpoint to a
  # real URL. Wire the deploy target in before writing any product code — the
  # deploy path is cheapest to fix while there is nothing to lose.
  #
  # Disabled (`if: false`) until a host is chosen — see Q1 in TRACKER.md. A
  # deploy job that echoes a TODO and exits 0 would paint the pipeline green
  # while nothing deploys, which is precisely the self-deception the phase exit
  # criterion exists to prevent. Skipped is honest; fake-green is not.
  deploy:
    needs: [backend, frontend]
    if: false
    runs-on: ubuntu-latest
    env:
      DEPLOY_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "TODO(phase-0) wire Fly.io or the VPS deploy here"
          exit 1
      - name: Smoke the deployed health endpoint
        run: |
          curl --fail --silent --show-error "$DEPLOY_URL/api/health"
