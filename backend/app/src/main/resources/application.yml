spring:
  application:
    name: storm-almanac
  threads:
    # Virtual threads carry the Monte Carlo fan-out and the solver queue.
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/storm_almanac}
    username: ${DATABASE_USER:almanac}
    password: ${DATABASE_PASSWORD:almanac}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never touches it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  # OAuth2 login is configured, deliberately, nowhere.
  #
  # SecurityConfig installs oauth2Login only when a ClientRegistrationRepository
  # exists, which is to say only when a provider is configured here. Declaring
  # the registrations with empty ${GOOGLE_CLIENT_ID:} placeholders would not be
  # a harmless default: a ClientRegistration refuses a blank client id, so the
  # application would fail to start everywhere the secret is absent — which is
  # everywhere, since nothing is deployed and a client registration is issued
  # against a redirect URI that does not exist yet (D1 in TRACKER.md).
  #
  # To turn login on, add — and keep the secrets out of this file:
  #
  #   spring.security.oauth2.client.registration.google.client-id: ...
  #   spring.security.oauth2.client.registration.google.client-secret: ...
  #   spring.security.oauth2.client.registration.google.scope: openid,profile,email
  #
  #   spring.security.oauth2.client.registration.discord.client-id: ...
  #   spring.security.oauth2.client.registration.discord.client-secret: ...
  #   spring.security.oauth2.client.registration.discord.scope: identify,email
  #   spring.security.oauth2.client.registration.discord.authorization-grant-type: authorization_code
  #   spring.security.oauth2.client.registration.discord.redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #   spring.security.oauth2.client.provider.discord.authorization-uri: https://discord.com/oauth2/authorize
  #   spring.security.oauth2.client.provider.discord.token-uri: https://discord.com/api/oauth2/token
  #   spring.security.oauth2.client.provider.discord.user-info-uri: https://discord.com/api/users/@me
  #   spring.security.oauth2.client.provider.discord.user-name-attribute: id
  #
  # Google needs no provider block: Boot knows it. Discord does, because it is
  # OAuth2 without the OIDC half — the same reason identity carries two user
  # services rather than one.

management:
  health:
    # The Redis starter is on the classpath for the solve cache's `redis`
    # option, and its health indicator is installed whether or not that option
    # is selected. With the cache in-process nothing talks to Redis, so a Redis
    # that is not there made /actuator/health answer 503 on an application that
    # was serving perfectly well — found by running the image the way Render
    # runs it. Turn this back on in the change that selects `solve-cache: redis`,
    # which is ADR 0012's trigger: a second node.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

storm-almanac:
  version: ${APP_VERSION:dev}
  # Which implementation backs each Track B seam. Both stay in the codebase.
  # See docs/adr/0003-the-honesty-rule.md
  substrate:
    drop-report-store: postgres    # postgres | almanac-store
    solve-coordinator: single-node # single-node | almanac-raft
    # in-process until there is a second node to share with — see
    # docs/adr/0012-the-solve-cache-is-in-process-until-there-is-a-second-node.md
    solve-cache: in-process        # in-process | redis | almanac-raft-kv

server:
  port: ${PORT:8080}
  # Deployed, the reader talks to Vercel, which rewrites to Render (B5, one
  # origin), so where they actually are arrives only as X-Forwarded-* headers.
  # Honouring them is what makes {baseUrl} in an OAuth redirect URI the public
  # https origin rather than Render's own host over http — ForwardedOriginTest.
  #
  # `framework` rather than `native`: Tomcat's valve trusts only proxies on
  # private addresses, and whether Vercel's hop arrives looking like one is a
  # fact about two hosts nobody here has measured. The cost is that anything
  # can claim a forwarded client address, so **the remote address is not an
  # identity** — Phase 6's abuse controls must not rate-limit on it as if it were.
  forward-headers-strategy: framework

logging:
  level:
    io.stormalmanac: INFO
