# Single source of truth for dependency versions.
# See docs/adr/0004-solver-ojalgo.md before changing the solver.
[versions]
java            = "21"
springBoot      = "3.5.6"
springDepMgmt   = "1.1.7"
ojalgo          = "55.1.0"
junit           = "5.11.4"
assertj         = "3.27.3"
archunit        = "1.3.0"
testcontainers  = "1.20.4"
jqwik           = "1.9.2"

[libraries]
springBootStarterWeb        = { module = "org.springframework.boot:spring-boot-starter-web" }
springBootStarterWebsocket  = { module = "org.springframework.boot:spring-boot-starter-websocket" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBootStarterActuator   = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBootStarterJdbc       = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
springBootStarterSecurity   = { module = "org.springframework.boot:spring-boot-starter-security" }
springBootStarterOauth2     = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
springBootStarterRedis      = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
springBootStarterTest       = { module = "org.springframework.boot:spring-boot-starter-test" }
flywayCore                  = { module = "org.flywaydb:flyway-core" }
flywayPostgres              = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql                  = { module = "org.postgresql:postgresql" }
ojalgo                      = { module = "org.ojalgo:ojalgo", version.ref = "ojalgo" }
junitJupiter                = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher       = { module = "org.junit.platform:junit-platform-launcher" }
assertj                     = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit                    = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik                       = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
testcontainersPostgres      = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainersJunit         = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
springBoot    = { id = "org.springframework.boot", version.ref = "springBoot" }
springDepMgmt = { id = "io.spring.dependency-management", version.ref = "springDepMgmt" }
